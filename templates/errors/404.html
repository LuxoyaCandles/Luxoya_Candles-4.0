{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section-padding pt-navbar text-center" style="min-height:60vh;display:flex;align-items:center">
    <div class="container">
        <h1 class="display-1 fw-bold text-gold">404</h1>
        <h3>Page Not Found</h3>
        <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-gold">Back to Home</a>
    </div>
</section>
{% endblock %}
