<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxoya Reels | Watch luxury moments</title>
    
    <!-- Lock Dark Theme -->
    <style>
        :root {
            --lx-black: #0B0A0A;
            --lx-gold: #D4AF37;
            --lx-text: #FFFFFF;
            --lx-font-primary: 'DM Sans', sans-serif;
            --lx-font-display: 'Playfair Display', serif;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--lx-black);
            overflow: hidden; /* Prevent body scroll */
            font-family: var(--lx-font-primary);
            color: var(--lx-text);
        }
        
        /* Top Navigation */
        .reels-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        
        .reels-nav-logo img {
            height: 45px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .reels-nav-close {
            color: white;
            font-size: 2rem;
            text-decoration: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: color 0.2s;
        }
        .reels-nav-close:hover {
            color: var(--lx-gold);
        }

        /* Container for scrolling */
        .reels-container {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
            scroll-behavior: smooth;
        }
        .reels-container::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        /* Single Reel */
        .reel-wrapper {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            position: relative;
            background: var(--lx-black);
        }

        /* Video element constraints to mimic mobile screen on desktop */
        .reel-content {
            width: 100%;
            height: 100%;
            max-width: 500px;
            position: relative;
            background-color: #1a1a1a;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        @media (max-width: 768px) {
            .reel-content {
                max-width: 100%;
            }
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Placeholder styling if src is image */
            opacity: 0.85;
        }

        /* Bottom overlay content */
        .reel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 80px 20px 20px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
            z-index: 2;
        }

        .reel-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: var(--lx-font-display);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .reel-desc {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 20px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            line-height: 1.4;
            max-width: 85%;
        }

        /* Buttons */
        .btn-reel-shop {
            background-color: var(--lx-gold);
            color: #0B0A0A;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-reel-shop:hover {
            background-color: #FDF5E6;
            transform: scale(1.05);
        }

        /* Right sidebar actions */
        .reel-sidebar {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 3;
        }

        .reel-action-btn {
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            cursor: pointer;
            padding: 0;
        }
        .reel-action-btn:hover {
            transform: scale(1.1);
        }
        .reel-action-btn.liked {
            color: #ff3b30;
        }
        .reel-action-btn i {
            font-size: 2.2rem;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
        .reel-action-btn span {
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Locked Dark Theme Logo Top Left -->
    <div class="reels-nav">
        <a href="{{ url_for('index') }}" class="reels-nav-logo">
            <img src="{{ url_for('static', filename='images/logo-dark-theme.png') }}" alt="Luxoya Candles">
        </a>
        <a href="{{ url_for('index') }}" class="reels-nav-close" title="Close Reels">
            <i class="bi bi-x"></i>
        </a>
    </div>

    <!-- Reels Swipe Container -->
    <div class="reels-container">
        {% for reel in reels_data %}
        <div class="reel-wrapper">
            <div class="reel-content">
                {% if reel.url and reel.url != '#' %}
                <video class="reel-video" src="{{ reel.url }}" loop muted playsinline poster="{{ reel.thumb }}"></video>
                {% else %}
                <img class="reel-video" src="{{ reel.thumb }}" alt="{{ reel.title }}">
                <div class="position-absolute top-50 start-50 translate-middle text-center opacity-50">
                    <i class="bi bi-play-circle fs-1"></i>
                    <p class="small mt-2">Preview Mode</p>
                </div>
                {% endif %}
                
                <!-- Bottom Description & Shop Button -->
                <div class="reel-overlay">
                    <div class="reel-title">{{ reel.title }}</div>
                    <div class="reel-desc">{{ reel.desc }}</div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('products.collections') }}" class="btn-reel-shop">
                            <i class="bi bi-bag-heart"></i> SHOP NOW
                        </a>
                        <button class="btn btn-outline-light rounded-circle shadow" onclick="toggleMainReelAudio(this)" style="width: 48px; height: 48px;">
                            <i class="bi bi-volume-mute-fill"></i>
                        </button>
                    </div>
                </div>

                <!-- Right Sidebar Actions -->
                <div class="reel-sidebar">
                    <button class="reel-action-btn" onclick="this.classList.toggle('liked')">
                        <i class="bi bi-heart-fill"></i>
                        <span>{{ range(100, 999)|random }}K</span>
                    </button>
                    <button class="reel-action-btn">
                        <i class="bi bi-chat-dots-fill"></i>
                        <span>{{ range(10, 99)|random }}</span>
                    </button>
                    <button class="reel-action-btn" onclick="copyReelLink('{{ reel.url }}')">
                        <i class="bi bi-share-fill"></i>
                        <span>Share</span>
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoElements = document.querySelectorAll('.reel-video');
            
            // Intersection Observer to handle autoplay
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (video.tagName !== 'VIDEO') return;

                    if (entry.isIntersecting) {
                        video.play().catch(e => console.warn("Autoplay failed:", e));
                    } else {
                        video.pause();
                        video.currentTime = 0; // Reset to start
                    }
                });
            }, { threshold: 0.7 });

            videoElements.forEach(el => observer.observe(el));
        });

        // Global Mute/Unmute Toggle
        let isGlobalMuted = true;
        function toggleMainReelAudio(btn) {
            const icon = btn.querySelector('i');
            isGlobalMuted = !isGlobalMuted;
            
            document.querySelectorAll('video').forEach(v => {
                v.muted = isGlobalMuted;
            });

            document.querySelectorAll('.btn-outline-light i.bi-volume-up-fill, .btn-outline-light i.bi-volume-mute-fill').forEach(i => {
                i.className = isGlobalMuted ? 'bi bi-volume-mute-fill' : 'bi bi-volume-up-fill';
            });
        }

        function copyReelLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('Reel link copied to clipboard!');
            });
        }
    </script>
</body>
</html>
