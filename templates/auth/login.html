{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card" data-aos="fade-up">
                    <div class="text-center mb-4">
                        <a href="{{ url_for('index') }}" class="d-inline-block">
                            <img src="{{ url_for('static', filename='images/logo-light-theme.png') }}" alt="Luxoya Candles" height="80" class="mb-2" style="border-radius: 10px;">
                        </a>
                        <h3 class="auth-title mt-3">Welcome Back</h3>
                        <p class="text-muted small">Step into the light</p>
                    </div>

                    <!-- Google Sign-In Official Container (Most Reliable) -->
                    <div id="googleButtonContainer" class="mb-3"></div>

                    <!-- Custom Styled Button (Optional Fallback) -->
                    <button class="btn btn-outline-dark w-100 btn-lg shadow-sm mb-4 d-flex align-items-center justify-content-center glow-on-hover d-none" id="googleBtn" onclick="googleLogin()" style="background: #fff; border: 1px solid #ddd; color: #333; font-weight: 600;">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="24" class="me-2"> Continue with Google
                    </button>

                    <!-- Divider -->
                    <div class="d-flex align-items-center mb-4 text-center">
                        <hr class="flex-grow-1">
                        <span class="px-3 text-muted small fw-bold">OR LOGIN WITH EMAIL</span>
                        <hr class="flex-grow-1">
                    </div>

                    <!-- Email + Password Login -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <input type="email" class="form-control form-control-lg bg-light" id="email" name="email" placeholder="Email Address" required>
                        </div>

                        <div class="mb-4">
                            <div class="password-field-container">
                                <input type="password" class="form-control form-control-lg bg-light pe-5" id="password" name="password" placeholder="Password" required>
                                <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="text-end mt-1">
                                <a href="#" class="small text-muted text-decoration-none">Forgot?</a>
                            </div>
                        </div>

                        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                        <button type="submit" class="btn btn-luxoya-gold w-100 btn-lg" id="loginBtn">
                            <span class="btn-text">SIGN IN</span>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted small">New to Luxoya?</span>
                        <a href="{{ url_for('auth.register') }}" class="text-gold ms-1 small fw-bold text-decoration-none">CREATE ACCOUNT</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
