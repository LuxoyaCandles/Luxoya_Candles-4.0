{% extends "base.html" %}
{% block title %}Set Password{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card" data-aos="fade-up">
                    <div class="text-center mb-4">
                        <a href="{{ url_for('index') }}" class="auth-brand"><i class="bi bi-lamp-fill text-gold"></i> LUXOYA</a>
                        <h3 class="auth-title mt-3">Secure Your Account</h3>
                        <p class="text-muted">Create a password for your Google account</p>
                    </div>
                    
                    <form id="setupPasswordForm">
                        <div class="mb-3">
                            <label for="setup_password" class="form-label">Create Password</label>
                            <div class="password-field-container">
                                <input type="password" class="form-control pe-5" id="setup_password" placeholder="Min 8 characters" required minlength="8">
                                <button type="button" class="password-toggle-btn" onclick="togglePassword('setup_password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <!-- Password strength indicator -->
                            <div class="password-strength mt-2">
                                <div class="progress" style="height: 4px;">
                                    <div class="progress-bar" id="strengthBar" role="progressbar" style="width: 0%"></div>
                                </div>
                                <small class="text-muted" id="strengthText">Enter a password</small>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="setup_confirm" class="form-label">Confirm Password</label>
                            <div class="password-field-container">
                                <input type="password" class="form-control pe-5" id="setup_confirm" placeholder="Re-enter password" required>
                                <button type="button" class="password-toggle-btn" onclick="togglePassword('setup_confirm', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div id="setupError" class="alert alert-danger d-none" role="alert"></div>
                        
                        <button type="submit" class="btn btn-luxoya-gold w-100 btn-lg" id="setupBtn">
                            <span class="btn-text">Set Password & Continue</span>
                            <span class="btn-loading d-none">
                                <span class="spinner-border spinner-border-sm me-2"></span>Setting up...
                            </span>
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <small class="text-muted">
                            <i class="bi bi-shield-lock me-1"></i>Your password is encrypted and securely stored.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
// Password strength indicator
document.getElementById('setup_password').addEventListener('input', function() {
    const val = this.value;
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    let strength = 0;
    if (val.length >= 8) strength += 25;
    if (val.length >= 12) strength += 15;
    if (/[A-Z]/.test(val)) strength += 20;
    if (/[0-9]/.test(val)) strength += 20;
    if (/[^A-Za-z0-9]/.test(val)) strength += 20;
    
    bar.style.width = strength + '%';
    if (strength < 30) { bar.className = 'progress-bar bg-danger'; text.textContent = 'Weak'; }
    else if (strength < 60) { bar.className = 'progress-bar bg-warning'; text.textContent = 'Fair'; }
    else if (strength < 80) { bar.className = 'progress-bar bg-info'; text.textContent = 'Good'; }
    else { bar.className = 'progress-bar bg-success'; text.textContent = 'Strong'; }
});
</script>
{% endblock %}
